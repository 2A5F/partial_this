name: Miri

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Miri
      run: rustup +nightly component add miri
    - name: Build
      run: cargo +nightly build --verbose
    - name: Run tests
      run: cargo +nightly miri test --verbose
